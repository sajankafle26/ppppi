<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form method="get">
        Enter First Name: <input name="fname" type="text">
        <hr>
        Enter Last Name: <input name="lname" type="text">
        <hr>

        <label for="age"> Enter Age: </label>
        <input type="number" name="age" id="age">
        <hr>

        Enter Email: <input type="email" name="email">
        <hr>
        Enter Password: <input type="password" name="pass">
        <hr>

        Enter Gender: <input type="radio" name="gen" value="girl"> Female
        <input type="radio" name="gen" value="boy" checked> Male
        <hr>

        Hobbies
        <input type="checkbox" name="hobbies" value="reading" checked>Reading
        <input type="checkbox" name="hobbies" value="dance">Dancing
        <input type="checkbox" name="hobbies" value="coding">Code
        <hr>

        Country 
        <select name="country">
            <option value="USA">USA</option>
            <option>Nepal</option>
            <option selected>India</option>
            <option>Bhutan</option>
            <option>Pak</option>
        </select>
        <hr>
        color: <input type="color" name="color">
        <hr>
        date: <input type="date" name="date">
        <hr>
        time: <input type="time" name="time">
        <hr>
        Message: <textarea name="mss" cols="60" rows="10"></textarea>
        <hr>
        <button>send</button>
    </form>
</body>

</html>
